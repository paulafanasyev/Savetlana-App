# Dependabot: обновления зависимостей приходят PR-ами, CI проверяет каждый.
# Мажорные версии (Prisma 7, ESLint 10, Vitest 5 и т.п.) ломают совместимость —
# их делаем вручную и осознанно. Исправления уязвимостей (security updates)
# Dependabot присылает независимо от этих правил.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "svetlana/initial-implementation"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
