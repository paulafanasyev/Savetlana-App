# Svetlana AI Commerce — release pipeline (spec §132)
#
# Lint → Typecheck → Unit/Integration Tests → Security → Build → E2E → Artifact
# → Deploy → Smoke Tests → Release Verification
#
# The pipeline is repo-enforced: a red check on any stage blocks merge to the
# release branches. Tests run against a throwaway SQLite database per worker;
# no external credentials are required, and none are available to CI (secrets
# live only in the deployment platform, spec §46).

name: Release pipeline

on:
  push:
    branches: [main, svetlana/*]
  pull_request:
    branches: [main]

# Prevent a second run of the same pipeline from racing an in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static quality gate: lint + typecheck. Cheapest signal, runs first.
  # ---------------------------------------------------------------------------
  static:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/web
      - name: Prisma schema validation
        env:
          DATABASE_URL: file:./prisma/ci-validation.db
        run: npx prisma validate --schema=apps/web/prisma/schema.prisma
      - name: Typecheck
        run: npx tsc --noEmit -p apps/web/tsconfig.json

  # ---------------------------------------------------------------------------
  # Unit + integration tests. Per-worker SQLite DBs (see vitest.config.ts and
  # domains/rate-limits.ts setup) give real isolation without a service.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/web
      - name: Run test suite
        working-directory: apps/web
        env:
          # CI must never have real provider keys; tests assert sandbox honesty.
          AI_GATEWAY_API_KEY: ""
          SVETLANA_TEST_INFRA: "1"
        run: npx vitest run --shard ${{ matrix.shard }}/2 --coverage=false

  # ---------------------------------------------------------------------------
  # Security gate: dependency audit + secret leak scan (spec §38: no secrets
  # in Git).
  # ---------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Dependency audit (high & critical)
        run: npm audit --audit-level=high --omit=dev
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # PostgreSQL production schema. The app uses SQLite for test isolation, but
  # production must generate a PostgreSQL Prisma client and a deployable
  # migration baseline from the dedicated production schema.
  # ---------------------------------------------------------------------------
  postgres-schema:
    name: PostgreSQL schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: svetlana_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d svetlana_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate PostgreSQL Prisma client
        run: npm run db:generate:production
      - name: Validate PostgreSQL schema
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/svetlana_ci
        run: npx prisma validate --schema=apps/web/prisma-postgres/schema.prisma
      - name: Generate PostgreSQL baseline migration
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/svetlana_ci
        run: |
          mkdir -p apps/web/prisma-postgres/migrations/00000000000000_baseline
          npx prisma migrate diff --from-empty --to-schema-datamodel=apps/web/prisma-postgres/schema.prisma --script > apps/web/prisma-postgres/migrations/00000000000000_baseline/migration.sql
          test -s apps/web/prisma-postgres/migrations/00000000000000_baseline/migration.sql
      - name: Apply PostgreSQL baseline migration
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/svetlana_ci
        run: npx prisma migrate deploy --schema=apps/web/prisma-postgres/schema.prisma
      - name: Execute Prisma query against PostgreSQL
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/svetlana_ci
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from "@prisma/client";
          const prisma = new PrismaClient({ datasources: { db: { url: process.env.DATABASE_URL } } });
          try {
            const result = await prisma.$queryRawUnsafe("SELECT 1 AS ok");
            if (Number(result[0]?.ok) !== 1) throw new Error("PostgreSQL SELECT 1 failed");
            const user = await prisma.user.create({
              data: { email: "ci-postgres@example.com", passwordHash: "ci", name: "CI PostgreSQL", role: "BUYER" }
            });
            const found = await prisma.user.findUnique({ where: { id: user.id } });
            if (!found) throw new Error("Prisma PostgreSQL read-after-write failed");
            await prisma.user.delete({ where: { id: user.id } });
          } finally {
            await prisma.$disconnect();
          }
          NODE
      - name: Upload PostgreSQL migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-migration-baseline
          path: apps/web/prisma-postgres/migrations/00000000000000_baseline/migration.sql
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Production build. Proves the app compiles and every route renders.
  # ---------------------------------------------------------------------------
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [static, test, postgres-schema]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate production Prisma client
        run: npm run db:generate:production --workspace=apps/web
      - name: Build
        working-directory: apps/web
        run: npx next build
      - name: Verify no API key leaked into the client bundle
        working-directory: apps/web
        run: |
          if grep -rl "sk_test_\|sk_live_" .next/static 2>/dev/null; then
            echo "::error::Secret pattern found in client bundle"; exit 1
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Release gate: every prior stage must be green before anything deploys.
  # ---------------------------------------------------------------------------
  release-ready:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [static, test, security, postgres-schema, build]
    steps:
      - run: echo "All release-gate stages passed (spec §164). Safe to deploy."
