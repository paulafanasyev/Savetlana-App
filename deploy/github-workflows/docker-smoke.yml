name: Docker production smoke

on:
  push:
    branches: [main, svetlana/*]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker buildx build --target runner -t svetlana-app:ci --load .
          docker buildx build --target tools -t svetlana-app-tools:ci --load .
      - name: Start stack
        working-directory: deploy
        run: |
          g() { openssl rand -hex 32; }
          {
            echo DOMAIN=localhost; echo ACME_EMAIL=ci@example.com
            echo APP_IMAGE=svetlana-app:ci; echo TOOLS_IMAGE=svetlana-app-tools:ci
            echo POSTGRES_USER=svetlana; echo POSTGRES_PASSWORD=$(g); echo POSTGRES_DB=svetlana
            echo JWT_SECRET=$(g); echo PENDING_ACTION_KEY=$(g); echo OAUTH_STATE_KEY=$(g); echo CRON_SECRET=$(g)
          } > .env
          docker compose up -d db migrate app
      - name: Probe
        working-directory: deploy
        run: |
          set -e
          source .env
          probe() { docker compose exec -T app node -e "fetch('http://127.0.0.1:3000'+process.argv[1],{method:process.argv[2],headers:JSON.parse(process.argv[3])}).then(r=>{console.log(process.argv[1],r.status);process.exit(r.status===Number(process.argv[4])?0:1)}).catch(e=>{console.error(e);process.exit(1)})" "$1" "${2:-GET}" "${3:-{\}}" "${4:-200}"; }
          for i in $(seq 1 40); do probe /api/health && break || sleep 3; done
          probe /api/health
          probe /
          probe /catalog
          probe /api/cron/jobs POST '{}' 403
          probe /api/cron/jobs POST "{\"authorization\":\"Bearer $CRON_SECRET\"}" 200
          docker compose run --rm -e ADMIN_PASSWORD=ci-admin-password-123 migrate npx tsx scripts/create-admin.ts admin@example.com "CI Admin"
          docker compose exec -T db psql -U svetlana -d svetlana -tAc "select role from \"User\" where email='admin@example.com'" | grep -q ADMIN
          echo "SMOKE OK"
      - name: Report failure to PR
        if: failure()
        working-directory: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker compose logs --no-color --tail=120 > /tmp/logs.txt 2>&1 || true
          pr=$(gh pr list --head "${GITHUB_REF_NAME}" --json number -q '.[0].number' || true)
          [ -n "$pr" ] && { echo 'Docker smoke failed:'; echo '```'; tail -c 60000 /tmp/logs.txt; echo '```'; } > /tmp/body.md && gh pr comment "$pr" -F /tmp/body.md || true
