name: svetlana

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
  PUBLIC_APP_URL: https://${DOMAIN}
  JWT_SECRET: ${JWT_SECRET}
  PENDING_ACTION_KEY: ${PENDING_ACTION_KEY}
  OAUTH_STATE_KEY: ${OAUTH_STATE_KEY}
  CRON_SECRET: ${CRON_SECRET}
  STORAGE_PROVIDER: local
  STORAGE_LOCAL_DIR: /data/uploads
  PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-1.5}
  AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  PAYMENT_PROVIDER_BASE_URL: ${PAYMENT_PROVIDER_BASE_URL:-}
  PAYMENT_PROVIDER_API_KEY: ${PAYMENT_PROVIDER_API_KEY:-}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
  CDEK_TOKEN: ${CDEK_TOKEN:-}
  SMTP_URL: ${SMTP_URL:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 30
  migrate:
    image: ${TOOLS_IMAGE}
    restart: "no"
    environment: *app-env
    depends_on: { db: { condition: service_healthy } }
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment: *app-env
    depends_on: { migrate: { condition: service_completed_successfully } }
    volumes: ["uploads:/data/uploads"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment: { DOMAIN: "${DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [app]
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment: { CRON_SECRET: "${CRON_SECRET}" }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 300
          curl -fsS -m 120 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/jobs > /dev/null || echo "jobs FAILED"
        done
    depends_on: [app]
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { PGHOST: db, PGUSER: "${POSTGRES_USER}", PGPASSWORD: "${POSTGRES_PASSWORD}", PGDATABASE: "${POSTGRES_DB}" }
    volumes: ["./backups:/backups", "uploads:/data/uploads:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date -u +%Y%m%d-%H%M)
          pg_dump -Fc -f /backups/db-$$ts.dump && tar -czf /backups/uploads-$$ts.tgz -C /data uploads || echo "backup FAILED"
          find /backups -type f -mtime +14 -delete
          sleep 86400
        done
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  uploads:
  caddy_data:
