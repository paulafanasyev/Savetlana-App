  function page(hash) {

    return header(r) + '<main id="main" tabindex="-1">' + route(r) + '</main>' + (ui.chatOpen ? chatPanel() : '') + '<div class="toast" role="status" aria-live="polite">' + (ui.flash ? h(ui.flash) : '') + '</div>' +
      '<footer class="foot"><span>Svetlana AI Commerce · демо-версия</span><a href="https://github.com/paulafanasyev/Savetlana-App">Исходный код</a></footer>';
  }

  // ---------- действия ----------
  function flash(t) { ui.flash = t; clearTimeout(ui.ft); ui.ft = setTimeout(function () { ui.flash = null; var el = document.querySelector('.toast'); if (el) el.textContent = ''; }, 3200); }
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
  function formData(f) { var o = {}; Array.prototype.forEach.call(f.elements, function (el) { if (!el.name || el.type === 'submit') return; if ((el.type === 'radio' || el.type === 'checkbox') && !el.checked) return; o[el.name] = el.value; }); return o; }
  function onClick(e) {
    var t = e.target.closest('[data-act]'); if (!t || t.tagName === 'SELECT' || t.type === 'radio') return;
    var a = t.dataset.act, sku = t.dataset.sku, id = t.dataset.id;
    try {
      if (a === 'add') { SV.addToCart(sku, 1); flash('Добавлено в корзину'); }
      else if (a === 'fav') flash(SV.toggleFav(sku) ? 'Добавлено в избранное' : 'Убрано из избранного');
      else if (a === 'qty') { var l = SV.cartLines().filter(function (x) { return x.sku === sku; })[0]; if (l) SV.setQty(sku, l.qty + +t.dataset.d); }
      else if (a === 'chat') { ui.chatOpen = !ui.chatOpen; }
      else if (a === 'ask') { askSvetlana(t.dataset.q); }
      else if (a === 'confirm') { var m = SV.state().chat[+t.dataset.m], ac = m && m.actions[+t.dataset.j]; if (ac && ac.confirm && ac.confirm.type === 'cart') { SV.addToCart(ac.confirm.sku, 1); m.done[t.dataset.j] = true; SV.save(); flash('Добавлено в корзину'); } }
      else if (a === 'reset') { if (confirm('Сбросить демо: заказы, корзину и выплаты?')) { SV.reset(); ui.draft = null; ui.checkoutKey = null; flash('Демо сброшено'); go('#/'); return; } return; }
      else if (a === 'cancel') { if (!confirm('Отменить заказ? Если он оплачен, деньги вернутся на карту.')) return; SV.cancel(id); flash('Заказ отменён'); }
      else if (a === 'delivered') { SV.markDelivered(id); flash('Отлично! Деньги продавцу станут доступны к выводу'); }
      else if (a === 's-confirm') { SV.sellerConfirm(id); flash('Заказ подтверждён, соберите и отправьте его'); }
      else if (a === 's-return') { SV.approveReturn(id); flash('Возврат принят, деньги вернутся покупателю'); }
      else if (a === 'stock') { SV.confirmStock(sku); flash('Остаток подтверждён'); }
      else if (a === 'payout') { var p = SV.requestPayout(SV.state().sellerId); flash(p ? 'Выплата ' + rub(p.amount) + ' отправлена (тестовая)' : 'Нечего выводить'); }
      else return;
    } catch (ex) { flash(ex.message); }
    e.preventDefault(); render();
  }
  function onChange(e) {
    var t = e.target;
    if (t.dataset.act === 'seller-pick') { SV.state().sellerId = t.value; SV.save(); render(); }
    else if (t.dataset.act === 'delivery') { ui.delivery = t.value; var keep = formData(t.form); SV.state().lastAddress = keep; render(); }
  }
  function onSubmit(e) {
    var f = e.target, kind = f.dataset.form; if (!kind) return; e.preventDefault();
    var v = formData(f), id = f.dataset.id; ui.errors = {};
    try {
      if (kind === 'search') { go(link('/catalog', { q: v.q })); return; }
      if (kind === 'filter') { go(link('/catalog', { q: v.q, cat: v.cat, sort: v.sort, max: String(v.max || '').replace(/\D/g, '') })); return; }
      if (kind === 'ask' || kind === 'chat') { askSvetlana(v.q); }
      else if (kind === 'checkout') {
        var addr = { name: v.name, phone: v.phone, city: v.city, street: v.street, house: v.house, flat: v.flat }; SV.state().lastAddress = addr; SV.save();
        var made = SV.placeOrder({ address: addr, delivery: v.delivery, key: v.key }); ui.checkoutKey = null;
        flash(made.length > 1 ? 'Создано ' + made.length + ' ' + SV.plural(made.length, 'заказ', 'заказа', 'заказов') + ', оплатите первый' : 'Заказ создан, осталось оплатить'); go('#/order/' + made[made.length - 1].id); return;
      }
      else if (kind === 'pay') { SV.pay(id, v); flash('Оплата прошла. Продавец получил заказ'); var next = SV.state().orders.filter(function (o) { return o.status === 'PAYMENT_PENDING' && o.key && o.key === SV.order(id).key; })[0]; if (next) { flash('Оплачено. Остался ещё заказ ' + next.number); go('#/order/' + next.id); return; } }
      else if (kind === 'return') { SV.requestReturn(id, v.reason); flash('Возврат оформлен, продавец получил уведомление'); }
      else if (kind === 'dispute') { SV.openDispute(id, v.text); flash('Спор открыт. Деньги продавцу заморожены'); }
      else if (kind === 'ship') { SV.sellerShip(id, v.carrier, v.track); flash('Отправлено, покупатель видит трек'); }
      else if (kind === 'draft') { var pr = +String(v.price || '').replace(',', '.').replace(/[^\d.]/g, ''); ui.draft = SV.draftProduct(v.title, SV.state().sellerId, pr || null); }
      else if (kind === 'publish') { var d = Object.assign({}, ui.draft, { cat: v.cat, desc: v.desc }); var np = SV.publishProduct(d, SV.state().sellerId, Math.round(+v.qty)); ui.draft = null; flash('Опубликовано'); go('#/p/' + np.sku); return; }
      else if (kind === 'resolve') { var w = e.submitter ? e.submitter.value : 'buyer'; SV.resolveDispute(id, w, v.note); flash(w === 'buyer' ? 'Деньги возвращены покупателю' : 'Деньги разморожены продавцу'); }
    } catch (ex) { if (ex.fields) ui.errors = ex.fields; else if (kind === 'dispute') ui.errors = { text: ex.message }; flash(ex.message); }
    render();
    if (Object.keys(ui.errors).length) { var bad = document.querySelector('[aria-invalid="true"]'); if (bad) bad.focus(); }
    if (kind === 'chat' || kind === 'ask') { var log = document.querySelector('.chat-log'); if (log) log.scrollTop = log.scrollHeight; var ci = document.getElementById('chat-q'); if (ci) ci.focus(); }
  }
  var lastPath = null;
  function render() {
    var app = document.getElementById('app'), r = parseHash(location.hash), focusId = document.activeElement && document.activeElement.id;
    app.innerHTML = page(location.hash);
    document.title = (document.querySelector('main h1') || {}).textContent ? document.querySelector('main h1').textContent + ' · Svetlana демо' : 'Svetlana демо';
    if (r.path !== lastPath) { if (lastPath !== null) { window.scrollTo(0, 0); var m = document.getElementById('main'); if (m) m.focus({ preventScroll: true }); } lastPath = r.path; ui.errors = {}; }
    else if (focusId) { var el = document.getElementById(focusId); if (el) el.focus(); }
  }
  root.SV_APP = { page: page, parseHash: parseHash, link: link, ui: ui, askSvetlana: askSvetlana };
  if (typeof document !== 'undefined' && document.getElementById) {
    SV.load();
    document.addEventListener('click', onClick); document.addEventListener('change', onChange); document.addEventListener('submit', onSubmit);
    window.addEventListener('hashchange', render); window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ui.chatOpen) { ui.chatOpen = false; render(); } });
    render();
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script></body></html>
